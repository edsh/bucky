name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruefen:
    name: Lint, Typen, Tests, Bau
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          # Dieselbe Fassung, mit der veroeffentlicht wird. Bis Feature 045
          # prueften wir mit 22 und veroeffentlichten mit 24 — der ausgelieferte
          # Bau war also nie in dieser Form geprueft.
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen des Kerns prüfen
        run: npx tsc -p packages/deelk-poh-core/tsconfig.json

      - name: Typen des MCP-Adapters prüfen
        run: npx tsc -p apps/mcp/tsconfig.json

      # Beide neu seit Feature 047. Der Abruf-Worker faellt sonst durch jedes
      # Netz: Er hat keinen Klickpfad, keine Oberflaeche und laeuft nur nach
      # Zeitplan — ein Typfehler zeigte sich erst im Betrieb, zehn Minuten
      # nach der Veroeffentlichung.
      - name: Typen des Reservierungskerns prüfen
        run: npx tsc -p packages/reservierung-core/tsconfig.json

      - name: Typen des Abruf-Workers prüfen
        run: npx tsc -p apps/reservierungs-abruf/tsconfig.json

      - name: Typen der Oberfläche prüfen
        run: |
          npm exec --workspace @edsh-bucky/web -- svelte-kit sync
          npm run check --workspace @edsh-bucky/web

      - name: Tests beider Workspaces
        run: npm test

      - name: Bau
        run: npm run build

      # Der Klickpfad ist die einzige Pruefung, die die Oberflaeche als Ganzes
      # bedient. Bis Feature 045 lief er nur auf dem Rechner des Entwicklers —
      # ein Fehler, den nur dort jemand findet, haelt nichts auf.
      - name: Browser fuer den Klickpfad
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Klickpfad
        env:
          KLICKPFAD_BROWSER: chromium
          BASE: http://localhost:8787
        run: |
          npx wrangler dev --config apps/web/wrangler.jsonc --port 8787 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$BASE" && break
            sleep 2
          done
          curl -sf -o /dev/null "$BASE" || { echo "Wrangler ist nicht hochgekommen"; exit 1; }
          node tests/ui/klickpfad.mjs

  # Ab Feature 045 gibt es genau einen Weg nach draussen, und er fuehrt durch
  # `pruefen`. Die frueheren Pages-Ablaeufe liefen unabhaengig davon — rote
  # Tests hielten eine Veroeffentlichung nicht auf (FR-007).
  veroeffentlichen:
    name: Nach Cloudflare veröffentlichen
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bau
        run: npm run build

      # Gebaut wird hier erneut, statt das Ergebnis aus `pruefen` weiterzureichen.
      # Der Bau dauert Sekunden; ein Artefakt-Umweg waere mehr Bewegteile fuer
      # denselben, aus demselben Commit reproduzierten Stand.
      - name: Veröffentlichen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/web/wrangler.jsonc

      # Der zweite Worker (Feature 047). Er wird bewusst **nicht** in der
      # Vorschau veroeffentlicht: Jeder Aenderungsvorschlag brachte sonst einen
      # weiteren Cron mit, der alle zehn Minuten beim Verein abruft — bei drei
      # offenen Vorschlaegen das Vierfache des Kontingents.
      #
      # Seine Geheimnisse setzt dieser Ablauf nicht. Sie liegen im Worker und
      # werden einmalig von Hand gesetzt (quickstart.md Schritt 2); ein
      # Ablauf, der sie kennt, waere ein zweiter Ort, an dem sie stehen.
      - name: Abruf-Worker veröffentlichen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/reservierungs-abruf/wrangler.jsonc

  # Jeder Änderungsvorschlag bekommt eine eigene Adresse zum Ansehen — auch vom
  # Telefon, ohne Entwicklungsumgebung. `versions upload` laedt hoch, ohne zu
  # veroeffentlichen: der oeffentliche Stand bleibt unberuehrt (FR-013).
  vorschau:
    name: Vorschau für den Änderungsvorschlag
    needs: pruefen
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bau
        run: npm run build

      - name: Vorschau hochladen
        id: hochladen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config apps/web/wrangler.jsonc --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Adresse in den Vorschlag schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          AUSGABE: ${{ steps.hochladen.outputs.command-output }}
        run: |
          # Wrangler nennt die Vorschau-Adresse in seiner Ausgabe. Sie wird
          # daraus gelesen statt selbst zusammengebaut, weil der Kontoteil des
          # Namens nirgends sonst im Ablauf bekannt ist.
          ADRESSE=$(printf '%s' "$AUSGABE" | grep -oE 'https://pr-[0-9]+-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$ADRESSE" ]; then
            echo "Keine Vorschau-Adresse in der Wrangler-Ausgabe gefunden"
            exit 1
          fi
          printf '%s\n' \
            "Vorschau zu diesem Stand: $ADRESSE" \
            "" \
            "Sie ist nur zum Ansehen — der öffentliche Stand ist unverändert." > /tmp/vorschau.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/vorschau.txt --edit-last --create-if-none
