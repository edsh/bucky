name: GitHub Pages

on:
  push:
    branches: [main]
    # Nur was in das statische Bundle eingeht. Das Bauergebnis selbst
    # (apps/web/build) taugt nicht als Filter: Es ist gitignoriert und
    # entsteht erst hier im Workflow, kann sich durch einen Push also nie
    # aendern. Nicht gelistet und damit ohne Veroeffentlichung: apps/mcp,
    # tests, specs, tools und die Dokumentation.
    paths:
      - 'apps/web/**'
      - 'packages/deelk-poh-core/**'
      - '!packages/deelk-poh-core/tests/**'
      # Die Tabellen werden in tables.ts direkt importiert und landen
      # dadurch im Bundle.
      - 'data/poh/**'
      - 'package.json'
      - 'package-lock.json'
      # Ohne diese Zeile liesse sich der Workflow nicht per Push reparieren.
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Statisches Bundle bauen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      # Die Seite liegt unter /<repo>/; ohne diesen Basispfad zeigen die
      # internen Verweise ins Leere.
      - name: Bauen
        run: npm run build --workspace @edsh-bucky/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/build

  veroeffentlichen:
    name: Veröffentlichen
    needs: bauen
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
